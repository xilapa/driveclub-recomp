name: Windows release (manual)

# Builds the Windows package with packaging/package.sh and publishes it as a release of this repository.
# Start it from the Actions tab (Run workflow). The online server folder is not in this repository: it is taken
# from an upstream release's zip.

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version for the zip, version.txt and the tag v<version>, e.g. 0.4.2-headtracking.1
        required: true
      upstream_tag:
        description: Upstream release whose server folder goes into the package
        default: v0.4.2

permissions:
  contents: write

concurrency:
  group: windows-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 300
    defaults:
      run:
        shell: msys2 {0}
    env:
      VERSION: ${{ inputs.version }}
      UPSTREAM_TAG: ${{ inputs.upstream_tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      # release: false uses the runner's own C:\msys64, the path the build scripts expect.
      - uses: msys2/setup-msys2@v2
        with:
          msystem: CLANG64
          release: false
          update: true
          path-type: inherit
          install: >-
            curl
            mingw-w64-clang-x86_64-clang
            mingw-w64-clang-x86_64-llvm-tools
            mingw-w64-clang-x86_64-cmake
            mingw-w64-clang-x86_64-ninja
            mingw-w64-clang-x86_64-pkgconf
            mingw-w64-clang-x86_64-vulkan-headers
            mingw-w64-clang-x86_64-vulkan-loader
            mingw-w64-clang-x86_64-vulkan-memory-allocator
            mingw-w64-clang-x86_64-fmt
            mingw-w64-clang-x86_64-boost
            mingw-w64-clang-x86_64-robin-map
            mingw-w64-clang-x86_64-xxhash
            mingw-w64-clang-x86_64-sdl3
            mingw-w64-clang-x86_64-zydis
            mingw-w64-clang-x86_64-ffmpeg
            mingw-w64-clang-x86_64-protobuf
            mingw-w64-clang-x86_64-nlohmann-json
            mingw-w64-clang-x86_64-openssl
            mingw-w64-clang-x86_64-zlib
            mingw-w64-clang-x86_64-miniupnpc
            mingw-w64-clang-x86_64-glslang
            mingw-w64-clang-x86_64-python

      - name: Check the version
        run: |
          [[ $VERSION =~ ^[0-9A-Za-z.+-]+$ ]] || { echo "version may hold only letters, digits, . + and -" >&2; exit 1; }
          ! gh release view "v$VERSION" >/dev/null 2>&1 || { echo "release v$VERSION already exists" >&2; exit 1; }

      - name: Server folder from upstream
        run: |
          gh release download "$UPSTREAM_TAG" -R OverkillLabs3/driveclub-recomp -p '*-win64.zip' -D upstream
          python -m zipfile -e upstream/*-win64.zip upstream
          test -f upstream/*/server/driveclubsrv.exe

      - name: Package
        run: |
          DC_SERVER_DIR="$(ls -d "$PWD"/upstream/*/server)" bash packaging/package.sh "$VERSION"
          cd release && sha256sum "driveclub-recomp-$VERSION-win64.zip" > "driveclub-recomp-$VERSION-win64.zip.sha256"

      - name: Publish the release
        run: |
          gh release create "v$VERSION" "release/driveclub-recomp-$VERSION-win64.zip" \
            "release/driveclub-recomp-$VERSION-win64.zip.sha256" --target "$GITHUB_SHA" \
            --title "DriveClub Recomp $VERSION" \
            --notes "Built from $GITHUB_SHA by the Windows release (manual) workflow. The online server folder is from upstream $UPSTREAM_TAG. What this fork adds: see the README."
